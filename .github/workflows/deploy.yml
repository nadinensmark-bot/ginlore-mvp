name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Anon klíč je veřejný (chráněný RLS) — smí být v buildu i v repu.
          VITE_SUPABASE_URL: https://mtxvbrcvpktmpdjzqxpx.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10eHZicmN2cGt0bXBkanpxeHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTgzMDQsImV4cCI6MjEwMzEzNDMwNH0.reZTP7W-PBQwoAiWJdl3pMuC_8Re7EFszbqpiXq8Rkk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
